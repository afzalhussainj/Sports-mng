apiVersion: 1
regions:
  - name: ord  # Chicago (fastest for US)

services:
  - name: sports-gala
    git:
      repository_url: https://github.com/afzalhussainj/Sports-mng.git
      branch: main
    healthchecks:
      startup:
        http_path: /
        failing_threshold: 3
        initial_delay: 30
        period: 10
        success_threshold: 2
        timeout: 5
    env:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        scope: secret
      - key: DJANGO_SECRET_KEY
        scope: secret
      - key: ALLOWED_HOSTS
        value: <your-app-name>.koyeb.app
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://<your-app-name>.koyeb.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://<your-app-name>.koyeb.app"
      - key: SUPABASE_URL
        scope: secret
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: secret
    routes:
      - path: /
    ports:
      - name: http
        port: 8000
    scaling:
      min_instances: 1
      max_instances: 3
      target_cpu_utilization_percentage: 80
